<body>

    <h1>Task Manager</h1>
    <button id="editMode">Edit Tasks</button>
    <h2>Dashboard</h2>
    <p>Total Tasks: 0</p>

    <input type="text" placeholder="Enter your task">
   
    <select id="priority">

    <button id="addTask">Add Task</button>

    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>
